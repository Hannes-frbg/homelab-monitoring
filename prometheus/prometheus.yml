global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'proxmox-pve1'
    static_configs:
      - targets: ['192.168.178.169:9100']
    metrics_path: /metrics

  - job_name: 'proxmox-pve2'
    static_configs:
      - targets: ['192.168.178.2:9100']
    metrics_path: /metrics

  - job_name: 'pve-cluster'
    static_configs:
      - targets: ['192.168.178.169:8006', '192.168.178.2:8006']
    metrics_path: /pve
    params:
      module: ['default']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
